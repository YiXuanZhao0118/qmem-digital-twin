# ci-correctness — the hardware-independent gate from docs/objectives.md §6.
#
# Everything here must pass on any runner: precision, physics values, schema
# and static guards. Performance targets (60 FPS, <500 ms solver, load times)
# are deliberately NOT here — they need a pinned machine and belong in the
# separate post-merge `ci-performance` pipeline described in objectives.md §6,
# which does not exist yet.
#
# The precision guards specifically:
#   backend/tests/test_anchor_precision_guard.py                — float64 end to end
#   frontend/src/components/__tests__/anchorWritePath.guard.test.ts — no rounding on write
# Background: docs/float64-audit.md.

name: ci-correctness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        # The DB-backed tests assert real column types (float8 / jsonb), so a
        # sqlite stand-in would not exercise what they guard.
        image: postgres:16
        env:
          POSTGRES_USER: qmem
          POSTGRES_PASSWORD: qmem_password
          POSTGRES_DB: qmem_twin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # tests/conftest.py uses setdefault, so this wins over its dev-DB default.
      DATABASE_URL: postgresql+asyncpg://qmem:qmem_password@localhost:5432/qmem_twin

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      # Migrations seed the kind/asset rows several tests read, so a fresh
      # database has to be brought to head before pytest. Verified locally
      # against a scratch DB: identical results to the dev database.
      - name: alembic upgrade head
        run: python -m alembic upgrade head

      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npx tsc --noEmit

      # Static guard, already wired into `npm run build`.
      - name: anchor-access guard
        run: node ./scripts/check-anchor-access.mjs

      # QUARANTINE — 16 pre-existing failures in 6 files, red since well
      # before this workflow existed (frame/fiber assertion mismatches, not
      # import errors). They are excluded so the other 533 tests can actually
      # gate; a CI that is red on arrival gets ignored within a week.
      #
      # This list is debt, not policy. Every line removed from it is a real
      # improvement — delete the flag once the file passes.
      - name: vitest (minus quarantine)
        run: |
          npx vitest run \
            --exclude 'src/three/__tests__/bindingRendererGate.swap.test.ts' \
            --exclude 'src/three/__tests__/labRoot.invariant.test.ts' \
            --exclude 'src/three/__tests__/pbs252.swap.test.ts' \
            --exclude 'src/three/deltaAlphaFromHit.test.ts' \
            --exclude 'src/utils/__tests__/fiberAlignment.test.ts' \
            --exclude 'src/utils/__tests__/fiberBodyEndpointResolver.test.ts'

      # Visibility for the quarantine: runs the excluded files and reports
      # without gating, so the debt stays on screen instead of being silently
      # forgotten. Flip this to blocking (and delete it) once they are fixed.
      - name: vitest quarantine (non-blocking)
        continue-on-error: true
        run: |
          npx vitest run \
            src/three/__tests__/bindingRendererGate.swap.test.ts \
            src/three/__tests__/labRoot.invariant.test.ts \
            src/three/__tests__/pbs252.swap.test.ts \
            src/three/deltaAlphaFromHit.test.ts \
            src/utils/__tests__/fiberAlignment.test.ts \
            src/utils/__tests__/fiberBodyEndpointResolver.test.ts
